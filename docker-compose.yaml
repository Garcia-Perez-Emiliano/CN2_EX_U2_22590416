services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: agenda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agenda_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == maudaddy
      restart_policy:
        condition: on-failure

  agenda:
    image: emigape/cn2-agendatec:latest
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:admin1234@postgres:5432/agenda
    ports:
      - "5050:5000"
    networks:
      - agenda_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:

networks:
  agenda_network:
    driver: overlay
